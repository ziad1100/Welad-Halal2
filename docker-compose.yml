services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-welad}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - welad-halal-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - welad-halal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - welad-halal-redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - welad-halal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      target: development
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend/src:/app/src
      - ./apps/backend/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - welad-halal-network
    command: npm run start:dev

  web:
    build:
      context: ./apps/web
      target: development
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/index.html:/app/index.html
    environment:
      VITE_API_URL: http://localhost:3001/api
    depends_on:
      - backend
    networks:
      - welad-halal-network
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  welad-halal-postgres-data:
  welad-halal-redis-data:

networks:
  welad-halal-network:
    name: welad-halal-network
